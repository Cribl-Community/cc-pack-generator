# "Batch — Background" (Hard Rule 34) — the app's only Backend Function.
#
# This repo has no @cribl/apps scaffold (Hard Rule 25/26/29 — its own hand-rolled
# packaging predates that CLI), so this file and backend/run-batch-step.ts are
# hand-written rather than generated by `apps create`. `scripts/pkgutil.mjs`
# bundles every endpoint declared here into `default/backend-build/<name>.js`
# and ships a copy of this manifest with each `script:` rewritten to that path.
#
# `timeout: 300` (build 842; was 120). The platform max is 900 s since
# CRIBL-44805 ("Limits and Quotas for Cribl Apps Platform": endpoint timeout
# default 30 s, max 900 s). 300 s is what the Cribl AI Settings provider needs:
# one OCSF mapping through its agent measured ~87 s (2026-10-02). It must equal
# BACKEND_FUNCTION_CEILING_MS in src/ai-budget.ts, from which the stage deadline,
# the per-request AI timeout and the lease TTL are all derived, so a stage
# aborts and checkpoints rather than being killed mid-write.
runtime: js
endpoints:
  - name: runBatchStep
    script: backend/run-batch-step.ts
    description: >-
      Batch — Background stage runner. Advances ONE durable stage of ONE row per
      invocation and checkpoints it to the App's KV store, so a closed browser
      tab does not stop the run. Invoked once by the UI to start a run
      (kickoff), and thereafter by its own self-scheduled one-minute tick until
      the run finishes, is stopped, or is dismissed. Samples are resolved in
      foreground pre-flight — this function never generates or extends one; a
      row without a sample is skipped. AI extraction, mapping and repair DO run
      here, through the run's own non-secret provider/model snapshot (credentials
      stay in the platform's proxy injection). Direct AWS Bedrock is excluded:
      its SigV4 signing keys live in the browser, which this function has none of.
    timeout: 300
    memory: 256
